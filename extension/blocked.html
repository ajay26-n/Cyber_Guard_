<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard | Connection Intercepted</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #050505;
            --danger-main: #ff003c;
            --danger-glow: rgba(255, 0, 60, 0.6);
            --danger-dark: #4a0011;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at center, #1a0006 0%, var(--bg-base) 70%);
            overflow: hidden;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 999;
            background-size: 100% 3px;
            pointer-events: none;
        }

        .warning-container {
            max-width: 800px;
            width: 100%;
            background: rgba(10, 0, 2, 0.8);
            border: 2px solid var(--danger-main);
            position: relative;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.2), inset 0 0 20px rgba(255, 0, 60, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .hazard-stripes {
            height: 20px;
            width: 100%;
            background: repeating-linear-gradient(
                45deg,
                var(--danger-main),
                var(--danger-main) 15px,
                var(--danger-dark) 15px,
                var(--danger-dark) 30px
            );
            border-bottom: 2px solid var(--danger-main);
        }

        .content {
            padding: 4rem 3rem;
            text-align: center;
        }

        .warning-icon {
            font-size: 5rem;
            color: var(--danger-main);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px var(--danger-glow));
            animation: pulse-icon 2s infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--danger-glow)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px var(--danger-glow)); }
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--danger-main);
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--danger-glow);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .diagnostic-box {
            background: rgba(255, 0, 60, 0.05);
            border: 1px dashed var(--danger-main);
            padding: 1.5rem;
            text-align: left;
            margin-bottom: 2.5rem;
            display: inline-block;
            width: 100%;
            max-width: 600px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label { color: var(--text-muted); }
        .data-value { color: var(--danger-main); font-weight: 600; text-shadow: 0 0 5px var(--danger-glow); }
        .data-value.white { color: var(--text-main); text-shadow: none; }

        .btn-safe {
            background: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-muted);
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            padding: 1rem 3rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-safe:hover {
            background: var(--text-main);
            color: var(--bg-base);
            border-color: var(--text-main);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .corner { position: absolute; width: 20px; height: 20px; border-color: var(--danger-main); border-style: solid; }
        .top-left { top: 30px; left: 10px; border-width: 2px 0 0 2px; }
        .top-right { top: 30px; right: 10px; border-width: 2px 2px 0 0; }
        .bottom-left { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .bottom-right { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .content { padding: 2rem 1.5rem; }
            .diagnostic-box { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="warning-container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="hazard-stripes"></div>
        
        <div class="content">
            <i class="fas fa-hand-paper warning-icon"></i>
            
            <h1>Access Restricted</h1>
            
            <p class="subtitle">
                CyberGuard Threat Intelligence has actively severed the connection to this host to protect your system from compromised data.
            </p>

            <div class="diagnostic-box">
                <div class="data-row">
                    <span class="data-label">INTERCEPT REASON:</span>
                    <span class="data-value" id="interceptReason">PHISHING / MALICIOUS PAYLOAD DETECTED</span>
                </div>
                <div class="data-row">
                    <span class="data-label">THREAT LEVEL:</span>
                    <span class="data-value">CRITICAL</span>
                </div>
                <div class="data-row">
                    <span class="data-label">TARGET URL:</span>
                    <span class="data-value white" id="blockedUrlDisplay">[ BLOCKED DOMAIN ]</span>
                </div>
                <div class="data-row">
                    <span class="data-label">INCIDENT ID:</span>
                    <span class="data-value white" id="incidentId">CG-00000000</span>
                </div>
            </div>

            <a href="javascript:history.back()" class="btn-safe"><i class="fas fa-arrow-left"></i> RETURN TO SAFETY</a>
        </div>
    </div>

    <script>
        document.getElementById('incidentId').innerText = 'CG-' + Math.random().toString(36).substr(2, 9).toUpperCase();

        const urlParams = new URLSearchParams(window.location.search);
        const blockedUrl = urlParams.get('url') || urlParams.get('target');
        const reason = urlParams.get('reason');
        
        if (blockedUrl) {
            document.getElementById('blockedUrlDisplay').innerText = blockedUrl;
        }
        if (reason) {
            document.getElementById('interceptReason').innerText = reason;
        }
    </script>

</body>
</html>
